<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ladder Jump</title>
<meta name="description" content="Ladder Jump: a one-tap rooftop ladder game for Android.">
<style>
  :root { --bg:#0b0818; --fg:#ece9f8; --muted:#a9a3c8; --accent:#00f5d4; --orange:#ff9f1c; --card:#16122b; --line:#2e2755; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:linear-gradient(#0b0818,#24104a);
         color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center; }
  main { max-width:520px; }
  h1 { margin:0 0 4px; font-size:2.6rem; line-height:1.1; letter-spacing:.04em; }
  h1 span { color:var(--accent); } h1 b { color:var(--orange); }
  p { color:var(--muted); }
  a.btn { display:inline-block; margin-top:12px; padding:10px 20px; border-radius:12px; background:var(--card);
          border:1px solid var(--line); color:var(--accent); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1><span>LADDER</span> <b>JUMP</b></h1>
  <p>Hold. Release. Cross. A one-tap rooftop ladder game for Android.</p>
  <a class="btn" href="ladder-jump-privacy/">Privacy Policy</a>
</main>
</body>
</html>
